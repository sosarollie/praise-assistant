[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praise"
version = "0.1.0"
description = "Evidence-driven orchestration for authorized multi-agent security work"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
praise = "praise.cli:main"

[tool.setuptools.packages.find]
include = ["praise*"]

[tool.setuptools.package-data]
praise = ["roles.json"]
