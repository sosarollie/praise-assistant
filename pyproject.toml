[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praise"
version = "0.2.0"
description = "Configured OMP role delegation and durable engagement-scoped JSON coordination"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
praise = "praise.cli:main"

[tool.setuptools.packages.find]
include = ["praise*"]

[tool.setuptools.package-data]
praise = ["roles.json", "integration/RULES.md", "integration/agents/*.md", "integration/extensions/*.js", "integration/extensions/*.mjs", "integration/skills/*/*.md", "integration/skills/**/*"]
