[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praiseassistant"
version = "0.1.0"
description = "Evidence-driven orchestration for authorized multi-agent security work"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
praiseassistant = "praiseassistant.cli:main"

[tool.setuptools.packages.find]
include = ["praiseassistant*"]

[tool.setuptools.package-data]
praiseassistant = ["roles.json"]
