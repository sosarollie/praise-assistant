name: "✨ Feature request / enhancement"
description: "Propose a new capability or enhancement for any VVAH stage (S0-S11), the CLI, backends, or outputs"
title: "[Feature]: "
labels: ["type:feature", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for the idea! Please search existing issues first to avoid duplicates."
  - type: dropdown
    id: stage
    attributes:
      label: Target VVAH stage
      description: Which pipeline step would this feature affect? Choose Cross-cutting if it spans CLI/config/backend, or Not sure.
      options: ["S0 - Static AST/callgraph seed (optional)", "S1 - Attack-surface mapping", "S2 - Threat modeling", "S3 - Strategy/prioritization", "S4 - Research lenses", "S5 - Pre-filter gates", "S6 - Adversarial verification", "S6-EV — Exploit verification (Beta)", "S7 - Deduplication", "S8 - Chaining/reporting", "S9 - SARIF emission", "S10 - Remediation", "S11 - Validation", "Cross-cutting", "Not sure"]
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Feature category
      description: "Which delivery phase (and its steps) does this target, or which cross-cutting area?"
      options: ["Discovery & Modeling — S0 seed / S1 attack-surface / S2 threat model / S3 prioritization", "Deep Dive & Verification — S4 research lenses / S5 pre-filter / S6 adversarial verification", "S6-EV — Exploit verification (Beta)", "Synthesis & Reporting — S7 dedup / S8 chaining / S9 SARIF & report output", "Remediation & Validation — S10 remediation / S11 validation", "Model backends / provider routing", "Input formats / integrations (repos.csv, CMDB, CVE feed)", "CLI & user experience", "Configuration / profiles", "Performance / cost controls", "Batch / multi-repo scanning", "Documentation", "Other"]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What can't you do today, and why does it matter? Please keep under ~1,500 characters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How might this work? Describe the expected behavior, inputs, and outputs. Please keep under ~1,500 characters.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds you use today, or prior art. Please keep under ~1,000 characters.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Anything else — example targets, expected impact, or references. Do NOT paste credentials, source from scanned repos, or scan findings content."
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: "I understand that any Contribution I submit is subject to the **Contribution Submission Terms and Agreement** within [**CONTRIBUTING.md**](https://github.com/visa/visa-vulnerability-agentic-harness/blob/main/CONTRIBUTING.md), including the provisions on Ownership and Sufficient Rights, Legal Authority to Bind, No Conflicting Obligations, No Restricted Data, and Applicable License Terms, and further that a record of my agreement to these terms, including my username and submission metadata, will be maintained indefinitely as part of the project's public record, and that the rights I have granted under the applicable license are irrevocable."
          required: true
