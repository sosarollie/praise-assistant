name: "🐞 Bug report"
description: "Report a defect in the VVAH pipeline (S0-S11), CLI, remediation/validation, or a backend"
title: "[Bug]: "
labels: ["type:bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Please do not include sensitive, personal, or confidential data** — including scan findings output or source from scanned repositories. Share **error output only**.
        
        Please report security vulnerabilities by emailing the security team at: **`vvaharness@visa.com`**. 
        For coordinated disclosure and additional reporting channels, see: 
        - Visa Vulnerability Disclosure Program: https://usa.visa.com/about-visa/vulnerability-disclosure.html
        Please do **not** report security vulnerabilities through public GitHub issues.

  - type: dropdown
    id: stage
    attributes:
      label: Affected pipeline stage
      description: Which stage is impacted? Choose cross-cutting if this spans CLI/config/backend behavior.
      options: ["S0 - Static AST/callgraph seed (optional)", "S1 - Attack-surface mapping", "S2 - Threat modeling", "S3 - Strategy/prioritization", "S4 - Research lenses", "S5 - Pre-filter gates", "S6 - Adversarial verification", "S6-EV — Exploit verification (Beta)", "S7 - Deduplication", "S8 - Chaining/reporting", "S9 - SARIF emission", "S10 - Remediation", "S11 - Validation", "Cross-cutting", "Not sure"]
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Command
      options: ["scan", "remediate", "validate", "ev-replay", "estimate", "doctor", "setup", "gc", "help", "other / unknown"]
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Model backend (via)
      options: ["cli (Claude CLI)", "sdk (Anthropic SDK)", "openai (OpenAI-compatible)", "deepagents (provider-routed)", "mixed / custom", "not applicable"]
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Configuration profile
      options: ["default.yaml", "sdk.yaml", "taint.yaml", "full.yaml", "custom", "not sure"]
  - type: input
    id: model
    attributes:
      label: Model(s) used
      description: "The exact model(s) for the run — copy from the run's run_manifest.json (it records the models/config/timing) or your config models: block. List per-role models if they differ. Enter n/a if not applicable."
      placeholder: "e.g. claude-opus-4-20250514  ·  or detection=gpt-4.1, validation=claude-sonnet-4"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VVAH version / commit
      placeholder: "e.g. 1.4.0 or a git SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python version, and install method
      placeholder: "e.g. Ubuntu 24.04, Python 3.11, pipx"
    validations:
      required: true
  - type: textarea
    id: command-line
    attributes:
      label: Exact command line
      description: Paste the exact vvaharness command you ran (redact paths if needed).
      placeholder: "e.g. vvaharness scan --repo /path/to/target --stop-after s9"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected instead. Please keep under ~1,500 characters.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: "Numbered steps to reproduce. Please keep under ~1,500 characters."
      placeholder: "1. Run vvaharness scan --repo ... 2. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error output
      description: "Error messages / stack traces only — please keep under ~2,000 characters (trim long traces to the first and last frames). Include vvaharness doctor output when relevant. Do NOT paste scan findings, source code from scanned repos, or credentials."
      render: shell
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: "I understand that any Contribution I submit is subject to the **Contribution Submission Terms and Agreement** within [**CONTRIBUTING.md**](https://github.com/visa/visa-vulnerability-agentic-harness/blob/main/CONTRIBUTING.md), including the provisions on Ownership and Sufficient Rights, Legal Authority to Bind, No Conflicting Obligations, No Restricted Data, and Applicable License Terms, and further that a record of my agreement to these terms, including my username and submission metadata, will be maintained indefinitely as part of the project's public record, and that the rights I have granted under the applicable license are irrevocable."
          required: true
