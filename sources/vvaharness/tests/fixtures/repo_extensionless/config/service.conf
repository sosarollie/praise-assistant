# NOTE: an environment-file fixture (a dotfile like ".env.example") would
# also demonstrate this, but a plain-text credential-shaped filename could
# not be committed here under this checkout's own file-write safeguards, for
# the same reason a real ".env" should never land in a repository. This
# ".conf" file exercises the identical mechanism instead: the suffix is not
# a known language extension, the basename is not a recognised
# security-config name, and it is not infrastructure-as-code, so it is
# classified as non-source and gets zero reviewers under reachability-gated
# catch-all coverage.
listen=127.0.0.1:8080
timeout=30
