# pipeline configuration
#
# Each model role chooses its own backend:
#   via: cli    → `claude` CLI subprocess (auth: run `claude` then `/login`).
#                 Can provide Read/Glob/Grep/Bash natively, but grants only
#                 tools named in that step's `allowed_tools`. It is the only
#                 detection backend capable of Bash.
#   via: sdk    → Anthropic Python SDK (auth: ANTHROPIC_SDK_API_KEY).
#                 Temperature control + connection pooling. Agentic roles
#                 (preprocess, verify) use a local sandboxed Read/Glob/Grep
#                 tool-loop — no Bash.
#   via: openai → OpenAI Chat Completions API (auth: OPENAI_API_KEY).
#                 Same agentic Read/Glob/Grep tool-loop as `sdk`; no Bash.
#   via: deepagents → dual meaning: agent graph on preprocess/verify/
#                 remediate/validate, zero-tool single-shot on the
#                 single-prompt detection roles. See the full legend in
#                 default.yaml.
#
# A bare string (e.g. `deepdive: claude-opus-4-7`) is still accepted and
# defaults to `via: cli` for backward compatibility.

models:
  # ── Credential and static-analysis summary ────────────────────────────
  # This profile is the example to COPY AND EDIT for a multi-backend layout: the
  # legend above documents all four routes, and commented alternatives sit next
  # to the roles that accept them. As SHIPPED, however, every model role is
  # via:deepagents, and every role except the exploit-verification `judge`
  # resolves to provider anthropic, so one Anthropic credential
  # (ANTHROPIC_SDK_API_KEY, ANTHROPIC_API_KEY or ANTHROPIC_AUTH_TOKEN) covers
  # an EV-off run out of the box, with no `claude` binary and no
  # OPENAI_API_KEY needed.
  # Uncomment a via:cli role and you must add Claude Code auth; uncomment a
  # via:openai role and you must add OPENAI_API_KEY. Note the ANTHROPIC_API_KEY
  # fallback for ANTHROPIC_SDK_API_KEY applies only while a run's backends stay
  # limited to sdk/deepagents — adding a via:cli role disqualifies it (the CLI
  # token is a gateway JWT), and then ANTHROPIC_SDK_API_KEY must be set
  # explicitly.
  # This profile enables S0 and sets step1.call_graph: tree_sitter explicitly,
  # as default.yaml and taint.yaml do; only sdk.yaml omits the key and inherits
  # the regex supplement.
  # --auto-step1: repo survey is pre-packed in Python → single SDK prompt
  # autoexclude: {id: claude-opus-4-7,       via: sdk}
  autoexclude: {id: claude-opus-4-7,     via: deepagents, provider: anthropic}
  # Primary role for step0 callgraph annotator mode.
  # Used when step0.callgraph_detection='llm'.
  # graph_annotate: {id: claude-opus-4-7, via: sdk}
  graph_annotate: {id: claude-opus-4-7, via: deepagents, provider: anthropic}

  # Step 1: agentic repo exploration — needs filesystem tools.
  # via:openai uses sandboxed Read/Glob/Grep (no Bash — keep it out of
  # step1.allowed_tools below). via:cli also works but requires claude auth.
  # Options:
  #   {id: claude-opus-4-7, via: cli}      ← CLI subprocess (needs auth)
  #   {id: gpt-5.5, via: openai}                  ← OpenAI/gateway (sandboxed tools)
  # preprocess:  {id: claude-sonnet-4-6, via: sdk}
  preprocess:  {id: claude-sonnet-4-6, via: deepagents, provider: anthropic}  # read-only harness tool loop
  # Step 2: threat model — single-shot SDK reasoning over packed evidence
  # threatmodel: {id: claude-opus-4-7,       via: sdk}
  threatmodel: {id: claude-opus-4-7,     via: deepagents, provider: anthropic}
  # threatmodel: {id: glm-5.2,             via: deepagents, provider: openai}   # + OPENAI_BASE_URL
  # Step 3: strategic decomposition — pure reasoning over the ContextPackage,
  # no tools needed → SDK for direct max_tokens / connection pooling.
  # decompose:   {id: claude-opus-4-7,       via: sdk}
  decompose:   {id: claude-opus-4-7,     via: deepagents, provider: anthropic}
  # decompose:   {id: glm-5.2,             via: deepagents, provider: openai}   # + OPENAI_BASE_URL
  # Step 4: deep-dive (deterministic single-pass; raise runs+temperature for vote mode)
  # Swap the line below to switch backend — all four are interchangeable here:
  #   {id: claude-opus-4-7,       via: sdk}     ← Anthropic SDK
  # deepdive:    {id: claude-opus-4-7,       via: sdk}
  deepdive:    {id: claude-opus-4-7,     via: deepagents, provider: anthropic}
  # Step 6: adversarial verification — needs Read/Glob/Grep.
  # cli and openai both provide them; swap freely:
  #   {id: claude-opus-4-7, via: cli}
  #   {id: gpt-5.5, via: openai}
  # verify:      {id: claude-opus-4-7, via: sdk}
  verify:      {id: claude-opus-4-7,     via: deepagents, provider: anthropic}
  # Step 7: semantic deduplication
  # dedup:       {id: claude-opus-4-7,       via: sdk}
  dedup:       {id: claude-opus-4-7,     via: deepagents, provider: anthropic}
  # Step 8: chain analysis
  # chain:       {id: claude-opus-4-7,       via: sdk}
  chain:       {id: claude-opus-4-7,     via: deepagents, provider: anthropic}

  # Step 10: enabled both in `scan` and through the standalone `remediate`
  # command. It selects up to step_remediate.top_n_findings, can edit target
  # source in fix mode, and writes artefacts under <repo>/security-remediation/.
  remediate:   {id: claude-opus-4-8, via: deepagents, provider: anthropic}

  # models.validate: used by enabled in-scan S11 and standalone `validate`.
  # orchestrator is the main model; persona overrides inherit it when unset.
  # provider selects the deepagents endpoint: openai (Chat Completions) | anthropic (Messages).
  #
  # ONE VENDOR PER PANEL. `via` and `provider` are read from `orchestrator` ONLY and
  # apply to the orchestrator and all three personas; on a persona key they are
  # ignored (only `id` is honoured). Personas may use a different model id from the
  # SAME vendor, but a mixed-vendor panel is refused when validate starts
  # (exit 2) — e.g. a `gpt-*` persona under an anthropic orchestrator.
  # See docs/models.md for persona model selection guidance.
  validate:
    orchestrator:       {id: claude-opus-5, via: deepagents, provider: anthropic}
    security_architect: {id: claude-opus-4-8}
    penetration_tester: {id: claude-opus-4-8}
    cross_repo_analyzer: {id: claude-opus-4-8}

  # S6 exploit verification — only runs when EV_API_COLLECTION is set. Four jobs, four
  # roles: batch triage, code reading, payload crafting, adjudication. Give `judge` a
  # DIFFERENT and ideally stronger model than `attacker`: it is the confirmation authority,
  # so its independence should hold at the model level and not merely structurally.
  #
  # `attacker` (the adaptive loop) is optional and the only role restricted by backend: it
  # supplies its own `http_request` tool, so it needs `via: sdk`, `openai` or `deepagents`
  # — `via: cli` cannot carry a caller's tool (its subprocess exposes built-ins only). Its
  # credential is therefore wanted only on a run that enables EV. Omit the line to run EV
  # without the adaptive loop; the deterministic payload set and the judge still run.
  # **Beta — API only.** Exploit verification needs a Postman/OpenAPI/Swagger collection and
  # can only verify findings that map to an HTTP endpoint; everything else stays the same.
  exploit_verification:
    attacker: {id: claude-opus-4-8, via: deepagents, provider: anthropic}
    judge:    {id: gpt-5.6-sol,     via: deepagents, provider: openai}
    classify: {id: claude-opus-4-8, via: deepagents, provider: anthropic}
    mapper:   {id: claude-opus-4-8, via: deepagents, provider: anthropic}


sdk:
  # Required for via:sdk roles. Set in .env — NEVER hardcode here.
  api_key: ${ANTHROPIC_SDK_API_KEY}
  base_url:   ${ANTHROPIC_SDK_BASE_URL}
  verify_ssl: true
  ca_cert:     ${ANTHROPIC_SDK_CA_CERT}     # absolute CA path; via:sdk + deepagents (anthropic)
  client_cert: ${ANTHROPIC_SDK_CLIENT_CERT} # absolute mTLS cert path; via:sdk + deepagents (anthropic)

openai:
  # Used by any via:openai role and by a deepagents role resolved to OpenAI
  # (which also reads verify_ssl/ca_cert/client_cert from here).
  # Set credentials in .env — never hardcode them here.
  api_key:    ${OPENAI_API_KEY}
  base_url:   ${OPENAI_BASE_URL}
  verify_ssl: true
  ca_cert:    ${OPENAI_CA_CERT}        # absolute CA path; via:openai + deepagents (openai)
  # organization: org-xxxx

cli:
  # Optional TLS/proxy for the `claude` CLI subprocess (used only by via:cli
  # roles; this profile configures none).
  # Unset values inject nothing; direct CLI auth/endpoint remain delegated to
  # Claude login, CLAUDE_CODE_OAUTH_TOKEN, and ANTHROPIC_BASE_URL.
  verify_ssl: true
  ca_cert:    ${CLAUDE_CLI_CA_CERT}    # absolute CA path -> NODE_EXTRA_CA_CERTS; empty = off
  # client_cert: unavailable here (Node exposes no env path for one); the sdk:
  # and openai: blocks expose configured mTLS to via:sdk/openai and deepagents.
  # Reasoning effort pinned for the `claude -p` subprocess so the scan never
  # inherits the operator's interactive /effort default (e.g. 'xhigh', which
  # some models reject). Opus-tier models support high|low|max|medium.
  effort: high

# Prompt-cache controls for all SDK/OpenAI model calls. Both values below are
# the built-in defaults, restated here so the knobs are discoverable.
cache_markers: "on"
cache_min_block_tokens: null
# `cache_route` IS pre-declared here — one of the two shipped profiles that do
# (`sdk.yaml` is the other). Only the `via: sdk` transport reads this key: the
# `via: deepagents` roles that make up most of this profile never consult it, and
# `via: cli` places no markers this tool controls.
#
# What declaring it actually changes, which is narrower than it looks: `auto`
# classifies the endpoint by hostname and withholds markers when it cannot
# recognise one, and with `sdk.base_url` unset it already resolves to the
# Anthropic regime. So this line only alters behaviour when
# `ANTHROPIC_SDK_BASE_URL` points at a gateway `auto` does not recognise — there
# it forces the Anthropic regime instead of forfeiting caching. That is a
# cost-over-fail-closed choice, and the right one for a gateway that genuinely is
# Anthropic-Messages-compatible. `full.yaml` and `taint.yaml` make the opposite
# choice on the same information, which is why this is a per-profile decision
# rather than something derivable from the roles.
#
# Consequence to understand before repointing this profile: `anthropic`
# short-circuits host detection, so Anthropic-shaped cache markers are sent
# regardless of the endpoint. Against a non-Anthropic gateway a strict one may
# reject the request outright and a lenient one will simply bill uncached. If you
# repoint `sdk.base_url` at such a gateway, set this back to `auto` (or comment the
# line out — `auto` is the built-in default).
cache_route: anthropic

# Step 0 — static seed (enabled in this profile, LLM mode)
step0:
  enabled: true
  callgraph_detection: llm      # rules | llm
  callgraph:
    llm:
      max_tokens: 16000
      max_candidates: 400
      max_batch_candidates: 150
      min_source_confidence: 0.75
      min_sink_confidence: 0.75
      failure_mode: empty         # empty | fail
      heuristic_supplement: true
      min_sources: 1
      min_sinks: 1
      max_heuristic_specs: 10
  # Rules mode has no implicit heuristic source/sink baseline. Blank paths mean
  # no external source/sink rules; use absolute paths for explicit rule packs.
  sources_yaml: ${VVA_STEP0_SOURCES_YAML:-}
  sinks_yaml:   ${VVA_STEP0_SINKS_YAML:-}
  call_graph_max_targets: 3    # max call-graph fanout targets per call site (step1 fallback if absent)

step1:
  # ── AI auto-exclude (per-target Step-1 overlay) ──
  # When true, after each clone the harness AI-surveys the target and derives a
  # per-target exclude overlay (dirs/exts/globs) BEFORE s1 — same behaviour as
  # the --auto-step1 CLI flag. Flag and config OR together; --no-auto-step1
  # hard-disables for a run; --step1-config still wins over both.
  auto_exclude: true
  auto_exclude_max_tokens: 8000     # output cap for the auto-exclude survey call (models.autoexclude)

  # gap_fill: with a non-empty S0 seed, use that seed + deterministic file
  # walk + tree-sitter graph without an S1 model call unless ALL escalation
  # conditions hold: more than 500 source files, web-api/web-app/service
  # classification, zero sinks OR (≥10 entry points and <5 sinks). An empty
  # seed is falsey and takes the agentic S1 path.
  mode: gap_fill                    # full | gap_fill
  call_graph: tree_sitter            # default call graph mode (regex | tree_sitter)

  # ── Agentic-phase quality vs cost ──
  max_budget_usd: 25.0              # retained for parity; this profile's raw SDK S1 does not enforce it

  max_turns: 40                     # tool-loop cap for via:sdk/via:openai; forwarded
                                    # when an installed via:cli build supports it.
                                    # Raise it for large repos where exploration force-finalises at the cap.

  allowed_tools:                    # tools the explorer may use. Read/Glob/Grep
                                    # are sufficient for repo survey on every
                                    # backend. Bash is intentionally NOT listed
                                    # (prompt-injection → host shell risk on
                                    # untrusted targets); add it ONLY if you
                                    # accept that risk for a trusted repo.
    - Read
    - Glob
    - Grep

  # Deterministic repo walk (ground-truth file inventory).
  # These APPEND to the built-in defaults in vvaharness/pipeline/stages/s1_preprocess.py — they
  # don't replace them. Leave null/[] for defaults only.
  # App/repo-specific exclusions come from --step1-config <file> or are
  # auto-derived per target by --auto-step1. Keep ONLY org-wide,
  # language-agnostic noise here.
  exclude_dirs:
    - .vs
    - .settings                    # Eclipse IDE metadata
    - .vscode
    - .idea                        # IntelliJ IDE metadata
    - node_modules
   
  exclude_exts:
    # compiled / packaged binaries (complements built-in .exe/.dll/.so/.jar/.class/.o/.a/.obj)
    - .msi
    - .nupkg
    - .pdb
    - .lib
    - .aar
    - .ser
    - .pbix
    # binary keystores / certs (.pem stays in scope — text, may hold secrets)
    - .p12
    - .pfx
    - .jks
    - .der
    - .cer
    # office binaries
    - .doc
    - .docx
    - .xls
    - .xlsx
    - .xlsm
    - .bmp
    # opaque data stores
    - .sqlite
    - .db
  exclude_globs:
    - "**/._*"                            # macOS resource forks
    
  max_file_kb: 1024                       # skip files larger than this (catches data dumps; lets normal CSV/JSON through)

  # Deterministic call-graph hardening (runs AFTER the agentic exploration):
  # Nodes are file-qualified (`rel/path.ext::name`) so save()/process() in
  # different files don't collide in BFS / connected-components / neighbor ctx.
  call_graph_validate: true        # drop agent-emitted caller/callee names that don't appear in any source file
  call_graph_supplement: true      # regex-scan source for calls to known fns; iteratively expand edges
  call_graph_rounds: 4             # max expansion rounds (each round adds newly-discovered callers as targets)
  call_graph_max_targets: 3        # when a bare callee resolves to N def-sites, keep top-N by dir-prefix affinity to caller

  # Structural dedup of per-environment config files (yml/json/ini/…).
  # Clusters files with identical key-structure, keeps one representative
  # per cluster (per top-level dir), and force-keeps any dropped file that
  # contains a literal secret or insecure value. Repo-agnostic — no path
  # assumptions. Set enabled: false to disable.
  config_dedup:
    enabled: true
    min_cluster_size: 5            # only dedup if ≥N files share identical key-shape
    keep_per_top_dir: true         # keep ≥1 representative per first-level dir
    promote_on_secret_hit: true    # never drop a file containing a literal credential
    promote_on_insecure_value: true  # …or verify:false / auth:none / debug:true etc.

step2:                              # threat-model (assets, trust boundaries, ranked threats)
  enabled: true                     # set false to skip threat modelling entirely
  max_tokens: 64000
  max_threats: 50                   # cap on emitted ranked threats
  baseline: auto                    # auto | owasp | none — inject kind-specific minimum-threat checklist (OWASP/CWE/MASVS/IaC)
  max_doc_chars: 32000              # README/SECURITY/ARCHITECTURE budget
  max_manifest_chars: 4000          # per-manifest cap (pom.xml, package.json, …)
  # Evidence caps for the s1-derived blocks (s2 runs AFTER s1):
  max_modules: 100                   # ctx.modules[] lines in the prompt
  max_entry_points: 400             # ctx.entry_points[] (STRIDE-tagged) lines
  max_config_reps: 80               # representative config files (post-dedup)
  # The first max_config_rep_bodies reps are packed as redacted contents capped
  # at max_config_rep_chars each; the remaining reps are listed by path only.
  max_config_rep_chars: 2000        # per-file char cap for packed config-rep bodies
  max_config_rep_bodies: 12         # reps packed as content; remainder path-only
  # agentic: false                  # opt-in per run: S2 swaps its single prompt for a
  #                                 # read-only Read/Glob/Grep tool-loop; max_turns (12)
  #                                 # is the only real bound (max_budget_usd is a no-op
  #                                 # on sdk/openai).
  max_api_artefacts: 100             # openapi/swagger/proto/graphql/wsdl/META-INF
  # AST call-graph frontier caps for the threat-model evidence view.
  # Visible in the `[s2] frontier` log line as `N/total edges`.
  max_graph_files: 250              # max files in the s2 AST evidence view
  max_graph_sinks: 100               # max sinks forwarded to the s2 prompt
  max_graph_edges: 100              # max call-graph edges forwarded to the s2 prompt

step3:
  max_tokens: 64000
  timeout: 3600                     # seconds; forwarded as the direct OpenAI request timeout
  taint_chunks: true                # emit entry→sink data-flow chunks (taint-NN) ranked above LLM risk chunks
  taint_max_hops: 10                # max call-graph depth when walking entry→sink
  taint_max_chunks: 120             # cap on emitted taint chunks — 2x the registered default (60),
                                    # matching default.yaml and taint.yaml; only sdk.yaml still ships
                                    # 60. Saturation symptom + when to raise: the same key's comment
                                    # in sdk.yaml.
  taint_files_per_hop: 6            # max files per hop fn (ranked by package-affinity to entry/sink); 0 = uncapped
  pack_by: loc                      # loc | tokens — shard-boundary metric for risk/catchall/specialist packing.
                                    #   loc    → legacy: respects risk_chunk_loc / catchall_chunk_loc / specialist_chunk_loc below (back-compat default)
                                    #   tokens → single budget: cuts at (chunk_token_budget − chunk_overhead_tokens) × 4 bytes; *_chunk_loc caps ignored
  chunk_token_budget: 180000        # (pack_by: tokens) model context window available to one s4 prompt
  chunk_overhead_tokens: 80000      # (pack_by: tokens) reserved for SYSTEM + RESEARCH-LENS + neighbor-ctx + step4.max_tokens output
  
  risk_chunk_loc: 10000             # split LLM-emitted chunk-NN into chunk-NN-a/b/… if total LOC exceeds this (0 = off)
  catchall_enabled: true            # emit catchall-NN coverage-sweep chunks for files no lens claimed (see catchall_deduct_lens_coverage)
  # When true, catch-all runs AFTER specialists and threat-fallback, but a
  # specialist's file claim does NOT count as "covered" — only risk/taint/
  # threat-fallback claims do. A specialist lens is scoped guidance, not a
  # generic review, so every source file still gets an unscoped catch-all
  # pass unless a risk/taint/threat-fallback chunk already claimed it.
  # Set false to restore the legacy backstop role.
  catchall_deduct_lens_coverage: true
  catchall_mode: all      # all | reachable_only — bounds the wider sweep
                                    # above to files forward/backward-reachable from
                                    # an entry point/sink; non-source files are
                                    # force-kept regardless (see
                                    # catchall_reachable_min_ratio below).
  # Fail open when reachable-only pruning is suspiciously sparse. Unsupported
  # language files are intentionally treated as reachable, so this guard is
  # for unexpectedly incomplete supported-language/cross-file graph coverage.
  # Kept here so switching catchall_mode back to reachable_only is one edit.
  catchall_reachable_min_ratio: 0.5   # revert to `all` if <50% of eligible files are reachable
  catchall_reachable_min_files: 0  
  catchall_chunk_loc: 4000          # max LOC per auto-generated coverage chunk
  catchall_max_files: 40           # file cap for catch-all packing (separate from specialists)
  max_files_per_chunk: 40           # hard cap for risk/specialist chunks
  taint_chunk_slice: function 

  specialists:                      # repo-wide specialist passes appended after risk chunks
    - crypto
    - logic-bug
    - access-control
    - batch-etl
    - iac                           # Terraform/Dockerfile/k8s/Helm/GH-Actions/Ansible — gated off if no IaC files present
    - deserialization               # gated off when no deserializer call site is present
    - csrf                          # state-changing endpoints missing CSRF token/SameSite — gated on web-framework surface
    - sensitive-data                # error message leakage, PII in logs/responses, plaintext storage — gated on entry_points
    - hardcoded-creds               # literal secrets in source/config — gated on credential pattern scan
    - log-injection                 # attacker-controlled data in log calls; missing security event logging — gated on entry_points
    - injection                     # SQLi/NoSQLi/cmd/LDAP/XPath/XXE/SSRF/path-traversal/XSS-server-emit/SSTI/open-redirect/CRLF/ReDoS — gated on presence of any injection-family sink

  specialist_chunk_loc: 10000       # shard specialist scope by this many LOC
  threat_surface_fallbacks: true    # add deterministic threat-tagged fallback chunks when threats remain uncovered
  threat_fallback_max_files: 20     # per-threat file cap for fallback chunk candidate selection
  max_threat_fallback_chunks: 50    # ceiling on fallback chunks; matches max_prompt_threats so every
                                    # threat reaching s3 can still get one. Lower it to bound s4 spend,
                                    # at the cost of leaving some threats without a dedicated chunk.
  
  # AST prompt frontier caps — control how much of the S1 context is forwarded
  # to the S3 strategist. Visible in the `[s3] ast frontier` log line as
  # `before->after` per dimension. Raise a cap when it is actively trimming.
  # NOTE: the entry-point/sink/edge caps below (200/200/200, notes 5000) raise
  # the registered defaults in _STEP_DEFAULTS (60/80/80, notes 2500). This
  # profile sets all six keys explicitly, matching default.yaml's raised
  # frontier. sdk.yaml and taint.yaml omit them and therefore run the registered
  # values, which DO trim on modest repos — tuning read from the numbers here
  # does not transfer to those two profiles.
  max_prompt_files: 180             # max files in the s3 decompose prompt
  max_prompt_entry_points: 200       # max entry points forwarded to s3
  max_prompt_sinks: 200              # max sinks forwarded to s3
  max_prompt_modules: 24            # max modules forwarded to s3
  max_prompt_call_edges: 200         # max call-graph edges forwarded to s3
  max_prompt_notes_chars: 5000      # char budget for the S1 notes block in the s3 prompt

step4:
  parallel: 5                       # concurrent chunks processed at once (1 = sequential)
  timeout: 1800                     # seconds; forwarded as the Anthropic SDK stream-request timeout
  runs: 1                           # repeat each chunk N×; via:cli auto-collapses to 1. SDK models that reject `temperature` still run all N (provider-default sampling; a NOTE is printed). OpenAI retains N runs.
  vote_threshold: 1                 # finding must appear in ≥N runs to survive → drops T>0 hallucinations
  # taint chunks: 1 run, confirm/refute the seeded (CWE, source, sink).
  taint_runs: 1
  taint_prompt_mode: confirm_refute       # discover | confirm_refute

  specialist_runs: 1                # specialist chunks run once (s6 verifies them)
  line_bucket: 5                   # canonical key buckets lines to +/- this many
  max_findings_per_run: 50          # keep top-N by confidence per run — all four shipped profiles
                                    # ship 50; the registered default for a key-omitting profile is 10.
                                    # Cap-binding diagnostics: the same key's comment in sdk.yaml.
  max_tokens: 64000                 # output token cap per deep-dive run
  neighbor_context_lines: 25        # ±lines of out-of-chunk callers/callees appended to each prompt (0 = off)
  neighbor_context_max: 50          # cap on neighbor excerpts per chunk

step5_prefilter:                    # deterministic gates applied BEFORE s6 verify
  # These gates are the primary FP defence here too: step4.runs is 1, so s4
  # majority voting is off, matching every currently shipped profile. See the
  # step5_prefilter header in sdk.yaml for the identical setup.
  min_pre_confidence: 0.5           # drop s4 findings with self-rated confidence below this
  require_evidence: true            # drop findings missing source_ref or sink_ref (data flow unproven)
  # Legacy: these two knobs used to live under `step6_verify`. s5 still reads
  # there as a fallback for older configs.
  # ── Pre-verify semantic dedup (S5-b) ──
  # Fires a single LLM dedup call BEFORE S6, collapsing cross-chunk duplicates
  # so the verifier never pays per-finding cost on the same root cause twice.
  line_tolerance: 5                  # trivial-dup line distance for S5 deterministic dedup (pre-verify);
                                    # EQUAL to step7_dedup.line_tolerance (5) in this profile. Two
                                    # findings within 5 lines pre-verify are the same raw output.
  pre_verify_semantic: true         # false → skip the pre-S6 LLM dedup pass entirely
  pre_verify_threshold: 0          # minimum survivors after S5-a gates to trigger the pass;
                                    # lower = more aggressive (0 = always run); raise for
                                    # small repos where one model call beats two separate ones

step6_verify:                       # adversarial verification (one verifier per finding)
  parallel: 7                       # concurrent verifier subprocesses (429 backoff is automatic)
  progress_file: false              # write <state>/s6_progress/<run_id>/s6_progress.json after each verification
  min_confidence: 4                 # TRUE_POSITIVE below this → dropped as UNCONFIRMED
  max_budget_usd: 10.0              # retained for parity; direct OpenAI verifier does not enforce it
  max_turns: 30                     # verifier tool-loop cap
  allowed_tools:
    - Read
    - Glob
    - Grep

# **Beta — API only.** Exploit verification needs a Postman/OpenAPI/Swagger collection and
# can only verify findings that map to an HTTP endpoint; everything else stays SAST-only.
step6_exploit_verification:         # live "exploit verification" (EV) — OFF unless EV_API_COLLECTION is set
  enabled: auto                     # auto = run when EV_API_COLLECTION is set (a local path to the API collection, from .env);
                                    # true = REQUIRED (no collection → exit 2, so a scan never quietly returns an unverified report);
                                    # false = forbidden (collection set → exit 2)
  on_unreachable: drop              # drop | warn | abort  (abort only disables EV, never the SAST scan)
  timeout_s: 15                     # per-request timeout (seconds) — the reachability probe AND every payload sent
  safe_mode: true                   # gate destructive payloads (dropped by the attack-builder) and DELETE requests (see below)
  allow_state_changing_methods: true   # let the agent send PUT/PATCH when a finding needs it
                                    # (the method is often the hypothesis: "this endpoint
                                    # also accepts PATCH"). Exploit verification is
                                    # **not read-only**. `POST` is always permitted and
                                    # all four shipped profiles set
                                    # `allow_state_changing_methods: true` (the registered
                                    # default is `false`), so an armed run can create
                                    # records, trigger jobs and modify existing resources
                                    # on the target. `DELETE` additionally requires
                                    # `safe_mode: false`, which no shipped profile sets.
  ev_overrides_static: false        # false (default): EV is additive — static verifies EVERY finding and owns the verdict + ranking CVSS; EV stamps its confirmation + advisory CVSS alongside. true = legacy: a hard deterministic proof overrides static and skips it
  max_requests_per_finding: 300     # HTTP request cap per finding — ONE budget shared by the first set and the adaptive loop
  max_payloads_per_finding: 50      # cap on deterministic payloads built per finding
  rate_limit_rps: 0                 # request throttle (0 = off)
  max_concurrency_target: 8         # in-flight requests to the target host, across every finding in the worker pool (0 = unlimited)
  max_concurrency_endpoint: 4       # in-flight requests to any single endpoint — doubles as the burst budget a race/TOCTOU finding may use (0 = unlimited)
  store_probes: false               # persist EVERY payload sent (not just confirmed) to the ev_probes table for replay/analysis; off by default — adds no model calls, only disk
  parallel: 5                       # findings verified at once (worker pool; 1 = serial)
  oob: auto                         # out-of-band listener: auto | on | off  (host via EV_OOB_URL)

  # `vvaharness ev-replay` re-checks confirmed findings against a REDEPLOYED target:
  ev_replay_variants: true          # when the stored tell is gone, try fresh same-subtype payloads before believing it fixed

  # Credential freshness — EV re-mints a token that expires mid-run (see docs):
  on_auth_failure: degrade          # degrade | abort | warn  when no credential can be established
  auth_expiry_skew_s: 60            # refresh a token this many seconds before it expires
  max_reauth: 3                     # run-wide budget for mid-run re-authentication

  # ── per-module knobs ─────────────────────────────────────────────────────
  # Same four names as models.exploit_verification, so "which model runs this" and
  # "how it is tuned" line up. Only names that would COLLIDE at the top level live
  # here: `parallel` above is findings-at-once, `max_turns` below is the attacker's
  # loop rather than a mapping session's, and the only `max_tokens` is the judge's
  # output cap. Everything with one meaning stays flat above.
  classify:                         # HTTP-observability triage — one short call per batch
    batch: 10                       # findings per call
    parallel: 5                     # batches in flight
  mapper:                           # endpoint→code, then finding→endpoint
    max_turns: 20                   # tool round-trips per chunk (both stages)
    parallel: 4                     # chunk sessions in flight (both stages)
    endpoint_index:
      chunk: 10                     # routes per session
    finding_map:
      chunk: 6                      # findings per session — smaller, each may read code
      max_endpoints: 5              # ranked endpoint candidates kept per finding
  attacker:                         # the adaptive payload loop
    enabled: true                   # needs models.exploit_verification.attacker on a via:sdk, via:openai, or via:deepagents node
    max_turns: 20                   # loop turn budget per finding
    max_tool_result_chars: 12000    # per-tool-result cap — bounds context growth across turns
  judge:                            # the independent confirmation authority
    max_tokens: 4000                    # output cap for one ruling; a truncated reply loses the verdict
    max_records: 24                 # transcript records handed over (baseline + most recent)
  # Target + auth come from EV_* env, never here (see docs/exploit-verification.md):
  #   EV_TARGET_URL, EV_AUTH_STRATEGY, EV_AUTH_TOKEN, EV_OOB_URL, ...

step7_dedup:                        # deduplication (deterministic + semantic)
  line_tolerance: 5                 # trivial-dup line distance — default.yaml and taint.yaml also ship
                                    # 5; only sdk.yaml ships the registered default (3)
  semantic: true                    # set false to skip the LLM dedup pass
  max_tokens: 64000

step8:
  max_tokens: 64000
  timeout: 3600                     # seconds; chain pass on large finding sets can exceed the 600s CLI default

step_remediate:                     # Remediation Agent — ON by default. Set `enabled: false` to opt out (`--remediate` forces on).
  enabled: true
  enforce_policy: true              # default-on deny-list/playbook gate + diff post-gate (revert forbidden-path edits)
  # Optional rule overrides; null uses the files bundled with the installation.
  #policy_file: null
  #playbook_file: null

  top_n_findings: 20                # top-N by CVSS — bounds cost on large reports (source of truth; --top N overrides ad-hoc; set 'all'/'*'/null to remediate EVERY finding)
  max_budget_usd: 10.0              # per-finding Claude Agent SDK spend cap
  max_turns: 40                     # per-finding Claude Agent SDK turn cap
  allowed_tools:                    # fix mode needs file-write — Edit/Write are
                                    # used instead of Bash so the agent can apply
                                    # diffs without a host shell. cwd-confined.
    - Read
    - Glob
    - Grep
    - Edit
    - Write

step_validate:                      # s11 validator — ON by default (mirrors step_remediate). Set `enabled: false` to opt out.
  enabled: true
  effort: high                      # Claude Agent SDK reasoning effort
  max_turns: 50                     # validation-panel turn cap
  max_budget_usd: 15.0              # validation-panel spend cap
  max_findings: 20                  # top-N validatable (open / remediated / failed, plus conditionally declined) by CVSS; --all bypasses, --finding ignores
  allowed_tools:                    # reviewer-persona tools for inspecting remediated code (read-only).
                                    # The parent may use Agent to launch personas; persona
                                    # tools are only the readers below. Write/Edit/Bash are denied.
    - Read
    - Grep
    - Glob

inject:
  # Optional external context. Relative paths resolve against this profile's
  # directory, not the target repo; use absolute paths in a copied profile.
  # Missing files safely mean no injected CVEs, controls, or CMDB context.
  # This packaged profile lives at vvaharness/config/profiles/, so these climb
  # 3 levels back up to the shipped repo-root inputs/ directory (see
  # docs/SETUP_GUIDE.md) — not ./inputs/, which would resolve inside profiles/.
  cve_file:       ../../../inputs/known_cves.json
  controls_file:  ../../../inputs/design_controls.yaml
  # CMDB exports. Optional: if unset or absent, VulContextSeverity environmental
  # scoring is skipped (CVSS base + OffensivePriority are still computed).
  cmdb_file:      ../../../inputs/cmdb.csv
  policy_file:    ./inputs/remediation_policy.yaml
  playbook_file:  ./inputs/remediation_playbook.yaml
batch:
  # PAT for cloning private repos over HTTPS in --repo-file mode.
  # Injected as https://x-access-token:<PAT>@host/org/repo.git
  # Leave blank to fall back to git's own credential helper / SSH.
  git_token: ${GITHUB_TOKEN}
  # Base clone URL used when a .csv batch row supplies only (AppID, RepoName).
  # RepoName is the full repo slug → {git_base_url}/{RepoName}.git
  git_base_url: ${GIT_BASE_URL}
  # Rows whose RepoName matches any of these case-insensitive globs are
  # dropped at parse time — never cloned, never scanned. Use for UI-test /
  # automation / perf harnesses that have no production attack surface.
  skip_repo_patterns:
    - "*automation*"
    - "*-playwright*"
    - "*-selenium*"
    - "*-karate*"
    - "*perf-script*"
    - "*perf-test*"
    - "*test-buddy*"
    - "*-e2e*"
    - "*-mock-*"

scan_progress:
  # ── Real-time file/chunk-level progress tracking ────────────────────────
  # Emits S0-S11 stage lifecycle lines plus detailed S1 discovery, S2 notes,
  # S3 queueing, and S4 chunk/result/summary lines to stderr. Report output is
  # unaffected.
  #
  # Environment variable override: VVAHARNESS_SCAN_PROGRESS_ENABLED=1
  enabled: true
  # compact: lifecycle lines plus notable file lists; verbose: every file;
  # summary_only: only the final S4 summary block (which may span several lines);
  # stage_only: only numbered stage start/done lines;
  # llm_debug: verbose plus backend prompt payload traces for each LLM call.
  style: compact    # compact | verbose | summary_only | stage_only | llm_debug

output:
  # Folders inside the clone kept when source is purged after a scan (the
  # cloned source is deleted unless --keep-clones). Checkpoints live in
  # $VVAHARNESS_STATE_DIR (~/.vvaharness/state), not the clone, so --resume
  # is unaffected by cleanup.
  preserve_on_cleanup: [security-scan, security-remediation]
  # Step 9 ingest upload destination for report.md + report.sarif.
  ingest_url: ${VVAHARNESS_INGEST_URL:-}
  # Bool (true/false) or path to CA bundle used for ingest TLS verification.
  ingest_verify: ${VVAHARNESS_INGEST_VERIFY:-true}
  # Bearer token for ingest hub upload. Keep unset to skip upload.
  ingest_token: ${VVAHARNESS_INGEST_TOKEN:-}
