# `extend`, not a copy: ruff uses the NEAREST config for a file and never merges with an outer one.
extend = "../validation/ruff.toml"

# The repo root, so isort agrees on first-party under both discovery and `--config`.
src = ["../.."]

# Run as `ruff check vvaharness/backends/`; `--config <path>` re-anchors the globs below to the cwd.

[lint]
# PLC0415 (imports at top) is the only rule ruff has for these conventions; the rest is review.
extend-select = ["PLC0415", "ERA001"]

[lint.per-file-ignores]
# `**/`-prefixed so the ignores survive both invocation modes.
"**/__init__.py" = ["D104", "F401"]  # re-export facades
# The legacy-shaped wrappers mirror the registry backends' signatures verbatim:
# the arg count IS the legacy contract (PLR0913), and permission_mode/max_tokens
# are accepted-and-ignored on this route by design (ARG001).
"**/llm/deepagents.py" = ["PLR0913", "ARG001"]
